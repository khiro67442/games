<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>スイカ系落下マージゲーム</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #eef6e9;
        --bg-accent: #dcefd2;
        --panel: #ffffff;
        --panel-border: #cfe3c2;
        --ink: #22331c;
        --ink-soft: #5a6e52;
        --accent: #2e9e4f;
        --accent-dark: #1f7a3a;
        --danger: #e63946;
        --gold: #f2a007;
        --box-fill: rgba(255, 255, 255, 0.55);
        --box-line: #7fae6d;
        --shadow: 0 10px 30px rgba(46, 90, 40, 0.14);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #101a10;
          --bg-accent: #16240f;
          --panel: #1c2b1a;
          --panel-border: #38512f;
          --ink: #eef7e6;
          --ink-soft: #a9bfa0;
          --accent: #4cc96f;
          --accent-dark: #7ed491;
          --danger: #ff6473;
          --gold: #ffb92e;
          --box-fill: rgba(10, 20, 8, 0.35);
          --box-line: #5d8a4e;
          --shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
        }
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        font-family: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Hiragino Sans", sans-serif;
        background:
          radial-gradient(1100px 500px at 85% -80px, var(--bg-accent), transparent 60%),
          var(--bg);
        color: var(--ink);
        min-height: 100vh;
        -webkit-tap-highlight-color: transparent;
      }
      .wrap {
        max-width: 1060px;
        margin: 0 auto;
        padding: 18px 14px 34px;
      }
      .layout {
        display: flex;
        gap: 18px;
        align-items: flex-start;
        justify-content: center;
        flex-wrap: wrap;
      }
      /* ---------- game column ---------- */
      .game-col { flex: 0 1 460px; min-width: 0; width: 100%; max-width: 460px; }
      .hud {
        display: flex;
        gap: 10px;
        margin-bottom: 10px;
      }
      .hud-card {
        background: var(--panel);
        border: 2px solid var(--panel-border);
        border-radius: 14px;
        box-shadow: var(--shadow);
        padding: 8px 12px;
        flex: 1;
        min-width: 0;
      }
      .hud-card.next-card { flex: 0 0 92px; text-align: center; }
      .hud-label {
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.12em;
        color: var(--ink-soft);
      }
      .hud-value {
        font-size: 26px;
        font-weight: 800;
        line-height: 1.15;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .hud-value.small { font-size: 19px; padding-top: 4px; }
      #nextCanvas { display: block; margin: 0 auto; }
      .stage {
        position: relative;
        background: var(--panel);
        border: 2px solid var(--panel-border);
        border-radius: 18px;
        box-shadow: var(--shadow);
        padding: 8px;
      }
      #game {
        display: block;
        width: 100%;
        height: auto;
        border-radius: 10px;
        touch-action: none;
        cursor: pointer;
        user-select: none;
        -webkit-user-select: none;
      }
      .overlay {
        position: absolute;
        inset: 8px;
        border-radius: 10px;
        background: rgba(16, 26, 14, 0.72);
        display: none;
        align-items: center;
        justify-content: center;
        text-align: center;
        z-index: 5;
        padding: 20px;
      }
      .overlay.show { display: flex; }
      .overlay-inner { color: #fff; }
      .overlay h2 {
        margin: 0 0 6px;
        font-size: 34px;
        font-weight: 800;
        letter-spacing: 0.04em;
      }
      .overlay p { margin: 4px 0; font-size: 15px; font-weight: 700; opacity: 0.92; }
      .overlay .final-score { font-size: 44px; font-weight: 800; color: #ffd94d; line-height: 1.1; }
      .btn {
        font-family: inherit;
        font-weight: 800;
        font-size: 15px;
        border: none;
        border-radius: 999px;
        padding: 11px 22px;
        cursor: pointer;
        background: var(--accent);
        color: #fff;
        box-shadow: 0 4px 0 var(--accent-dark);
        transition: transform 0.06s ease, box-shadow 0.06s ease, filter 0.15s;
      }
      .btn:hover { filter: brightness(1.06); }
      .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--accent-dark); }
      .btn.ghost {
        background: var(--panel);
        color: var(--ink);
        border: 2px solid var(--panel-border);
        box-shadow: 0 4px 0 var(--panel-border);
      }
      .btn.ghost:active { box-shadow: 0 1px 0 var(--panel-border); }
      .overlay .btn { margin-top: 14px; font-size: 17px; padding: 13px 30px; }
      .controls {
        display: flex;
        gap: 10px;
        margin-top: 12px;
        flex-wrap: wrap;
      }
      .controls .btn { flex: 1; min-width: 104px; }
      .toast {
        position: absolute;
        left: 50%;
        top: 64px;
        transform: translateX(-50%) scale(0.8);
        background: var(--gold);
        color: #3a2703;
        font-weight: 800;
        font-size: 19px;
        padding: 8px 20px;
        border-radius: 999px;
        box-shadow: 0 6px 18px rgba(0,0,0,0.25);
        opacity: 0;
        pointer-events: none;
        z-index: 6;
        white-space: nowrap;
        transition: opacity 0.18s ease, transform 0.18s ease;
      }
      .toast.show { opacity: 1; transform: translateX(-50%) scale(1); }
      /* ---------- side column ---------- */
      .side-col { flex: 1 1 300px; min-width: 270px; max-width: 400px; display: flex; flex-direction: column; gap: 14px; }
      .panel {
        background: var(--panel);
        border: 2px solid var(--panel-border);
        border-radius: 16px;
        box-shadow: var(--shadow);
        padding: 14px 16px;
      }
      .panel h3 {
        margin: 0 0 10px;
        font-size: 16px;
        font-weight: 800;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .panel h3 .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); flex: none; }
      .evo-list { display: flex; flex-direction: column; gap: 2px; }
      .evo-item {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 3px 8px 3px 4px;
        border-radius: 10px;
        opacity: 0.42;
        filter: saturate(0.4);
        transition: opacity 0.3s, background 0.3s;
      }
      .evo-item.reached { opacity: 1; filter: none; }
      .evo-item.current-max { background: color-mix(in srgb, var(--gold) 18%, transparent); }
      .evo-item canvas { flex: none; }
      .evo-name { font-weight: 800; font-size: 14px; }
      .evo-pts { margin-left: auto; font-size: 12px; font-weight: 700; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
      .evo-arrow { text-align: center; color: var(--ink-soft); font-size: 11px; line-height: 0.6; padding-left: 16px; text-align: left; }
      .howto { font-size: 13.5px; line-height: 1.85; font-weight: 500; color: var(--ink); margin: 0; padding-left: 1.2em; }
      .howto li::marker { color: var(--accent); font-weight: 800; }
      .stat-row { display: flex; justify-content: space-between; font-size: 14px; font-weight: 700; padding: 4px 0; }
      .stat-row span:last-child { font-variant-numeric: tabular-nums; }
      .combo-hot { color: var(--danger); }
      @media (max-width: 560px) {
        .wrap { padding: 12px 8px 26px; }
        .hud-value { font-size: 22px; }
        .side-col { max-width: 460px; }
        .overlay h2 { font-size: 28px; }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="layout">
        <!-- ===== game ===== -->
        <div class="game-col">
          <div class="hud">
            <div class="hud-card">
              <div class="hud-label">SCORE</div>
              <div class="hud-value" id="scoreVal">0</div>
            </div>
            <div class="hud-card">
              <div class="hud-label">BEST</div>
              <div class="hud-value small" id="bestVal">0</div>
              <div class="hud-label">MAX <span id="maxFruitName">―</span></div>
            </div>
            <div class="hud-card next-card">
              <div class="hud-label">NEXT</div>
              <canvas id="nextCanvas" width="72" height="56"></canvas>
            </div>
          </div>

          <div class="stage">
            <canvas id="game" width="440" height="680"></canvas>
            <div class="toast" id="toast"></div>
            <div class="overlay" id="overlay">
              <div class="overlay-inner">
                <h2 id="overlayTitle">ゲームオーバー</h2>
                <p id="scoreLabel">スコア</p>
                <div class="final-score" id="finalScore">0</div>
                <p id="overlaySub"></p>
                <button class="btn" id="againBtn" type="button">もう一度あそぶ</button>
              </div>
            </div>
          </div>

          <div class="controls">
            <button class="btn ghost" id="pauseBtn" type="button">一時停止</button>
            <button class="btn ghost" id="soundBtn" type="button">音 ON</button>
            <button class="btn" id="restartBtn" type="button">リスタート</button>
          </div>
        </div>

        <!-- ===== side ===== -->
        <div class="side-col">
          <div class="panel">
            <h3><span class="dot"></span>進化チャート</h3>
            <div class="evo-list" id="evoList"></div>
          </div>

          <div class="panel">
            <h3><span class="dot"></span>いまの記録</h3>
            <div class="stat-row"><span>落とした数</span><span id="statDrops">0</span></div>
            <div class="stat-row"><span>合体した回数</span><span id="statMerges">0</span></div>
            <div class="stat-row"><span>最大コンボ</span><span id="statCombo">×1</span></div>
            <div class="stat-row"><span>スイカを作った回数</span><span id="statMelons">0</span></div>
          </div>

          <div class="panel">
            <h3><span class="dot"></span>あそびかた</h3>
            <ul class="howto">
              <li>箱の上を動かして、タップ／クリックでフルーツを落とす（キーボードは ←→ で移動、↓ かスペースで落下）</li>
              <li>同じフルーツが2つくっつくと、1段階大きなフルーツに進化してスコアが入る</li>
              <li>短い間隔で合体を続けるとコンボ倍率アップ。落とせるのは「なし」まで、大きなフルーツは合体でしか作れない</li>
              <li>フルーツが上のラインを越えたままになるとゲームオーバー。目指せ、スイカ！</li>
            </ul>
          </div>
        </div>
      </div>
    </div>

<script>
(function () {
  "use strict";

  /* ================= fruit data ================= */
  // Suika-style evolution chain: cherry -> ... -> watermelon
  var FRUITS = [
    { name: "さくらんぼ", r: 16,  color: "#e63946", dark: "#b91f30", pts: 0 },
    { name: "いちご",     r: 24,  color: "#ff4d6d", dark: "#d12a4a", pts: 10 },
    { name: "ぶどう",     r: 33,  color: "#8b5cc7", dark: "#65389e", pts: 30 },
    { name: "デコポン",   r: 43,  color: "#ff9f1c", dark: "#d97c06", pts: 60 },
    { name: "なし",       r: 54,  color: "#e3cf7a", dark: "#bfa64b", pts: 100 },
    { name: "りんご",     r: 66,  color: "#d90429", dark: "#a30320", pts: 150 },
    { name: "洋なし",     r: 79,  color: "#8fce4e", dark: "#62a02c", pts: 210 },
    { name: "もも",       r: 93,  color: "#ffb3c1", dark: "#ef7e97", pts: 280 },
    { name: "パイナップル", r: 108, color: "#f4c93f", dark: "#d9a416", pts: 360 },
    { name: "メロン",     r: 124, color: "#8fd694", dark: "#57ab5e", pts: 450 },
    { name: "スイカ",     r: 142, color: "#2f9e44", dark: "#1b5e20", pts: 550 }
  ];
  var MAX_TIER = FRUITS.length - 1;
  var DROP_MAX = 4; // only tiers 0..4 can be dropped

  /* ================= geometry ================= */
  var W = 440, H = 680;
  var WALL_L = 24, WALL_R = 416, FLOOR = 648;
  var LINE_Y = 172;          // game-over line
  var DROP_Y = 92;           // spawn centre height
  var GRAV = 1900;           // px/s^2
  var OVER_TIME = 1.6;       // seconds above line before game over

  /* ================= dom ================= */
  var canvas = document.getElementById("game");
  var ctx = canvas.getContext("2d");
  var nextCanvas = document.getElementById("nextCanvas");
  var nctx = nextCanvas.getContext("2d");
  var scoreVal = document.getElementById("scoreVal");
  var bestVal = document.getElementById("bestVal");
  var maxFruitName = document.getElementById("maxFruitName");
  var overlay = document.getElementById("overlay");
  var overlayTitle = document.getElementById("overlayTitle");
  var overlaySub = document.getElementById("overlaySub");
  var finalScore = document.getElementById("finalScore");
  var toast = document.getElementById("toast");
  var pauseBtn = document.getElementById("pauseBtn");
  var soundBtn = document.getElementById("soundBtn");

  /* crisp rendering on retina */
  (function fitCanvas() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    [ [canvas, ctx], [nextCanvas, nctx] ].forEach(function (pair) {
      var c = pair[0], g = pair[1];
      var w = c.width, h = c.height;
      c.width = w * dpr; c.height = h * dpr;
      c.style.aspectRatio = w + " / " + h;
      if (c === nextCanvas) { c.style.width = w + "px"; c.style.height = h + "px"; }
      g.setTransform(dpr, 0, 0, dpr, 0, 0);
      c.dataset.lw = w; c.dataset.lh = h;
    });
  })();
  var LW = 440, LH = 680, NW = 72, NH = 56;

  /* ================= audio (synth) ================= */
  var audioCtx = null, soundOn = true;
  function ac() {
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audioCtx = null; }
    }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    return audioCtx;
  }
  function tone(freq, dur, type, vol, when, slideTo) {
    if (!soundOn) return;
    var a = ac(); if (!a) return;
    var t0 = a.currentTime + (when || 0);
    var o = a.createOscillator(), g = a.createGain();
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol || 0.16, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(a.destination);
    o.start(t0); o.stop(t0 + dur + 0.05);
  }
  function sndDrop()  { tone(190, 0.09, "triangle", 0.10, 0, 120); }
  function sndMerge(tier, combo) {
    var base = 300 + tier * 55 + Math.min(combo - 1, 6) * 40;
    tone(base, 0.14, "sine", 0.20);
    tone(base * 1.5, 0.18, "sine", 0.16, 0.05);
  }
  function sndBig() {
    [523, 659, 784, 1047].forEach(function (f, i) { tone(f, 0.22, "triangle", 0.18, i * 0.07); });
  }
  function sndOver() {
    tone(392, 0.25, "sawtooth", 0.08);
    tone(311, 0.25, "sawtooth", 0.08, 0.22);
    tone(233, 0.45, "sawtooth", 0.09, 0.44);
  }

  /* ================= fruit drawing ================= */
  function drawFruit(g, tier, x, y, r, opts) {
    opts = opts || {};
    var f = FRUITS[tier];
    g.save();
    g.translate(x, y);
    if (opts.rot) g.rotate(opts.rot);

    // body
    var grad = g.createRadialGradient(-r * 0.35, -r * 0.4, r * 0.15, 0, 0, r * 1.05);
    grad.addColorStop(0, f.color);
    grad.addColorStop(1, f.dark);
    g.beginPath();
    g.arc(0, 0, r, 0, Math.PI * 2);
    g.fillStyle = grad;
    g.fill();

    g.save();
    g.clip();
    if (tier === 10) { // watermelon stripes
      g.strokeStyle = "rgba(16,64,24,0.55)";
      g.lineWidth = r * 0.11;
      for (var i = -2; i <= 2; i++) {
        g.beginPath();
        g.moveTo(i * r * 0.42, -r);
        g.bezierCurveTo(i * r * 0.42 + r * 0.16, -r * 0.3, i * r * 0.42 - r * 0.16, r * 0.3, i * r * 0.42, r);
        g.stroke();
      }
    } else if (tier === 9) { // melon net
      g.strokeStyle = "rgba(255,255,255,0.35)";
      g.lineWidth = Math.max(1, r * 0.02);
      for (var a = -3; a <= 3; a++) {
        g.beginPath(); g.moveTo(a * r * 0.3, -r); g.lineTo(a * r * 0.3 + r * 0.25, r); g.stroke();
        g.beginPath(); g.moveTo(-r, a * r * 0.3); g.lineTo(r, a * r * 0.3 + r * 0.2); g.stroke();
      }
    } else if (tier === 8) { // pineapple crosshatch
      g.strokeStyle = "rgba(146,102,10,0.4)";
      g.lineWidth = Math.max(1.2, r * 0.025);
      for (var b = -4; b <= 4; b++) {
        g.beginPath(); g.moveTo(b * r * 0.32 - r * 0.4, -r); g.lineTo(b * r * 0.32 + r * 0.4, r); g.stroke();
        g.beginPath(); g.moveTo(b * r * 0.32 + r * 0.4, -r); g.lineTo(b * r * 0.32 - r * 0.4, r); g.stroke();
      }
    } else if (tier === 1) { // strawberry seeds
      g.fillStyle = "rgba(255,255,230,0.8)";
      var seeds = [[-0.4,-0.1],[0,-0.3],[0.4,-0.1],[-0.25,0.25],[0.25,0.25],[0,0.05],[-0.5,0.35],[0.5,0.35]];
      seeds.forEach(function (s) {
        g.beginPath(); g.ellipse(s[0]*r, s[1]*r, r*0.045, r*0.07, 0, 0, Math.PI*2); g.fill();
      });
    } else if (tier === 2) { // grape bumps
      g.fillStyle = "rgba(255,255,255,0.14)";
      [[-0.42,-0.3],[0.1,-0.52],[0.45,0.05],[-0.15,0.42]].forEach(function (s) {
        g.beginPath(); g.arc(s[0]*r, s[1]*r, r*0.34, 0, Math.PI*2); g.fill();
      });
    }
    // gloss
    g.beginPath();
    g.ellipse(-r * 0.38, -r * 0.46, r * 0.30, r * 0.17, -0.6, 0, Math.PI * 2);
    g.fillStyle = "rgba(255,255,255,0.35)";
    g.fill();
    g.restore();

    // outline
    g.beginPath(); g.arc(0, 0, r, 0, Math.PI * 2);
    g.strokeStyle = "rgba(0,0,0,0.14)";
    g.lineWidth = Math.max(1, r * 0.045);
    g.stroke();

    // tops: stems / leaves / crowns
    g.lineWidth = Math.max(2, r * 0.09);
    g.lineCap = "round";
    if (tier === 0 || tier === 5) { // cherry / apple stem + leaf
      g.strokeStyle = "#5b8c3e";
      g.beginPath(); g.moveTo(0, -r * 0.92); g.quadraticCurveTo(r * 0.1, -r * 1.2, r * 0.3, -r * 1.24); g.stroke();
      g.fillStyle = "#58b368";
      g.beginPath(); g.ellipse(r * 0.42, -r * 1.22, r * 0.26, r * 0.12, 0.5, 0, Math.PI * 2); g.fill();
    } else if (tier === 1 || tier === 2) { // strawberry / grape leaf cap
      g.fillStyle = "#3f9e4d";
      for (var k = -1; k <= 1; k++) {
        g.beginPath();
        g.ellipse(k * r * 0.34, -r * 0.97, r * 0.24, r * 0.11, k * 0.45, 0, Math.PI * 2);
        g.fill();
      }
    } else if (tier === 3) { // dekopon bump
      g.beginPath(); g.arc(0, -r * 0.98, r * 0.30, 0, Math.PI * 2);
      g.fillStyle = f.color; g.fill();
      g.strokeStyle = "#5b8c3e";
      g.beginPath(); g.moveTo(0, -r * 1.2); g.lineTo(0, -r * 1.34); g.stroke();
    } else if (tier === 8 || tier === 9 || tier === 10) { // crown / stem
      if (tier === 8) {
        g.fillStyle = "#3f9e4d";
        for (var c = -1; c <= 1; c++) {
          g.beginPath();
          g.moveTo(c * r * 0.2 - r * 0.1, -r * 0.9);
          g.lineTo(c * r * 0.22, -r * 1.3);
          g.lineTo(c * r * 0.2 + r * 0.12, -r * 0.9);
          g.closePath(); g.fill();
        }
      } else {
        g.strokeStyle = "#4c7a3f";
        g.beginPath(); g.moveTo(0, -r * 0.95); g.quadraticCurveTo(r * 0.06, -r * 1.12, r * 0.2, -r * 1.16); g.stroke();
      }
    } else if (tier === 6) { // pear leaf
      g.fillStyle = "#58b368";
      g.beginPath(); g.ellipse(r * 0.22, -r * 1.05, r * 0.24, r * 0.11, 0.5, 0, Math.PI * 2); g.fill();
      g.strokeStyle = "#7a5b2e";
      g.beginPath(); g.moveTo(0, -r * 0.95); g.lineTo(r * 0.05, -r * 1.14); g.stroke();
    }

    // face
    if (!opts.noFace && r >= 13) {
      var ey = r * 0.06, ex = r * 0.34, er = Math.max(1.6, r * 0.085);
      g.fillStyle = "rgba(38,30,20,0.88)";
      g.beginPath(); g.arc(-ex, ey, er, 0, Math.PI * 2); g.fill();
      g.beginPath(); g.arc(ex, ey, er, 0, Math.PI * 2); g.fill();
      g.fillStyle = "rgba(255,255,255,0.9)";
      g.beginPath(); g.arc(-ex + er * 0.35, ey - er * 0.35, er * 0.38, 0, Math.PI * 2); g.fill();
      g.beginPath(); g.arc(ex + er * 0.35, ey - er * 0.35, er * 0.38, 0, Math.PI * 2); g.fill();
      // mouth
      g.strokeStyle = "rgba(38,30,20,0.88)";
      g.lineWidth = Math.max(1.4, r * 0.05);
      g.beginPath();
      if (opts.happy) g.arc(0, r * 0.16, r * 0.16, 0.15 * Math.PI, 0.85 * Math.PI);
      else g.arc(0, r * 0.13, r * 0.13, 0.2 * Math.PI, 0.8 * Math.PI);
      g.stroke();
      // cheeks
      g.fillStyle = "rgba(255,110,130,0.35)";
      g.beginPath(); g.ellipse(-r * 0.56, r * 0.2, r * 0.13, r * 0.08, 0, 0, Math.PI * 2); g.fill();
      g.beginPath(); g.ellipse(r * 0.56, r * 0.2, r * 0.13, r * 0.08, 0, 0, Math.PI * 2); g.fill();
    }
    g.restore();
  }

  /* ================= game state ================= */
  var bodies = [];        // {tier,x,y,vx,vy,r,m,age,touched,above,cool,scale,dead}
  var particles = [];
  var floaters = [];      // {x,y,text,life,color,size}
  var state = "ready";    // ready | playing | paused | over
  var score = 0, best = 0;
  var drops = 0, merges = 0, melons = 0;
  var maxTierReached = -1, maxComboSeen = 1;
  var current = 0, next = 0;
  var dropX = W / 2, targetX = W / 2;
  var cooldown = 0;               // seconds until next drop is allowed
  var combo = 0, comboTimer = 0;  // chained merges
  var shake = 0;
  var dangerLevel = 0;            // 0..1 how close to game over
  var time = 0;
  var newReached = {};            // tier -> true once "first time" toast shown

  function randTier() {
    // weighted toward small fruit
    var bag = [0, 0, 0, 1, 1, 1, 2, 2, 3, 3, 4];
    return bag[Math.floor(Math.random() * bag.length)];
  }

  function makeBody(tier, x, y) {
    var r = FRUITS[tier].r;
    return {
      tier: tier, x: x, y: y, vx: 0, vy: 40,
      r: r, m: r * r, age: 0, touched: false,
      above: 0, cool: 0.12, scale: 0.6, dead: false, rot: 0, vr: 0
    };
  }

  function reset() {
    bodies = []; particles = []; floaters = [];
    score = 0; drops = 0; merges = 0; melons = 0;
    maxTierReached = -1; maxComboSeen = 1;
    combo = 0; comboTimer = 0; shake = 0; dangerLevel = 0;
    cooldown = 0; time = 0; newReached = {};
    current = randTier(); next = randTier();
    dropX = targetX = W / 2;
    state = "playing";
    overlay.classList.remove("show");
    pauseBtn.textContent = "一時停止";
    updateHUD(); drawNext(); buildEvo();
  }

  /* ================= effects ================= */
  function burst(x, y, tier, n, power) {
    var f = FRUITS[tier];
    for (var i = 0; i < n; i++) {
      var a = Math.random() * Math.PI * 2;
      var sp = (0.3 + Math.random() * 0.7) * (power || 260);
      particles.push({
        x: x, y: y,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 90,
        life: 0.55 + Math.random() * 0.4, maxLife: 0.9,
        size: 2.5 + Math.random() * 4.5,
        color: Math.random() < 0.5 ? f.color : f.dark
      });
    }
  }
  function confetti(x, y) {
    var cols = ["#e63946", "#f2a007", "#2e9e4f", "#3a86ff", "#ff4d6d", "#ffd94d"];
    for (var i = 0; i < 90; i++) {
      var a = -Math.PI / 2 + (Math.random() - 0.5) * 2.2;
      var sp = 260 + Math.random() * 420;
      particles.push({
        x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        life: 1.1 + Math.random() * 0.8, maxLife: 1.9,
        size: 3 + Math.random() * 4,
        color: cols[i % cols.length], rect: true, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 14
      });
    }
  }
  function floater(x, y, text, color, size) {
    floaters.push({ x: x, y: y, text: text, life: 1.0, color: color || "#fff", size: size || 20 });
  }
  var toastTimer = null;
  function showToast(msg, ms) {
    toast.textContent = msg;
    toast.classList.add("show");
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toast.classList.remove("show"); }, ms || 1600);
  }

  /* ================= physics ================= */
  function physics(dt) {
    var SUB = 4, h = dt / SUB, s, i, j;
    for (s = 0; s < SUB; s++) {
      for (i = 0; i < bodies.length; i++) {
        var b = bodies[i];
        b.vy += GRAV * h;
        if (b.vy > 1500) b.vy = 1500;
        b.x += b.vx * h;
        b.y += b.vy * h;
        b.rot += b.vr * h;
        b.vr *= 0.995;

        // walls
        if (b.x - b.r < WALL_L) { b.x = WALL_L + b.r; b.vx = Math.abs(b.vx) * 0.25; b.touched = true; }
        if (b.x + b.r > WALL_R) { b.x = WALL_R - b.r; b.vx = -Math.abs(b.vx) * 0.25; b.touched = true; }
        if (b.y + b.r > FLOOR) {
          b.y = FLOOR - b.r;
          b.vy = -Math.abs(b.vy) * 0.18;
          if (Math.abs(b.vy) < 26) b.vy = 0;
          b.vx *= 0.90;
          b.vr = b.vx * 0.004;
          b.touched = true;
        }
        if (b.y - b.r < 6) { b.y = 6 + b.r; b.vy = Math.abs(b.vy) * 0.2; }
      }
      // pair collisions
      for (i = 0; i < bodies.length; i++) {
        for (j = i + 1; j < bodies.length; j++) {
          var a = bodies[i], c = bodies[j];
          var dx = c.x - a.x, dy = c.y - a.y;
          var min = a.r + c.r;
          var d2 = dx * dx + dy * dy;
          if (d2 >= min * min || d2 === 0) continue;
          var d = Math.sqrt(d2);
          var nx = dx / d, ny = dy / d;
          var overlap = min - d;
          var tm = a.m + c.m;
          a.x -= nx * overlap * (c.m / tm); a.y -= ny * overlap * (c.m / tm);
          c.x += nx * overlap * (a.m / tm); c.y += ny * overlap * (a.m / tm);
          var rvx = c.vx - a.vx, rvy = c.vy - a.vy;
          var vn = rvx * nx + rvy * ny;
          if (vn < 0) {
            var e = 0.12;
            var imp = -(1 + e) * vn / (1 / a.m + 1 / c.m);
            a.vx -= imp * nx / a.m; a.vy -= imp * ny / a.m;
            c.vx += imp * nx / c.m; c.vy += imp * ny / c.m;
            // friction / rolling
            var tx = -ny, ty = nx;
            var vt = rvx * tx + rvy * ty;
            var fimp = vt * 0.06 / (1 / a.m + 1 / c.m);
            a.vx += fimp * tx / a.m; a.vy += fimp * ty / a.m;
            c.vx -= fimp * tx / c.m; c.vy -= fimp * ty / c.m;
            a.vr += vt * 0.0006; c.vr += vt * 0.0006;
            a.touched = c.touched = true;
          }
        }
      }
    }
  }

  function tryMerges() {
    var used = {};
    for (var i = 0; i < bodies.length; i++) {
      var a = bodies[i];
      if (a.dead || used[i] || a.cool > 0) continue;
      for (var j = i + 1; j < bodies.length; j++) {
        var c = bodies[j];
        if (c.dead || used[j] || c.cool > 0) continue;
        if (a.tier !== c.tier) continue;
        var dx = c.x - a.x, dy = c.y - a.y;
        // the solver rests touching pairs at exactly r1+r2, so contact
        // must count as a merge: use a small epsilon above the sum.
        var rr = (a.r + c.r) * 1.03;
        if (dx * dx + dy * dy > rr * rr) continue;

        // ---- merge! ----
        used[i] = used[j] = true;
        a.dead = c.dead = true;
        var mx = (a.x + c.x) / 2, my = (a.y + c.y) / 2;
        merges++;

        combo = (comboTimer > 0) ? combo + 1 : 1;
        comboTimer = 1.1;
        if (combo > maxComboSeen) maxComboSeen = combo;

        if (a.tier >= MAX_TIER) {
          // watermelon + watermelon -> vanish with a big bonus
          var bonus = 2000 * combo;
          score += bonus;
          burst(mx, my, MAX_TIER, 42, 420);
          confetti(mx, my);
          floater(mx, my - 40, "スイカ合体！ +" + bonus, "#ffd94d", 26);
          shake = Math.max(shake, 10);
          sndBig();
        } else {
          var nt = a.tier + 1;
          var nb = makeBody(nt, mx, my);
          nb.vx = (a.vx + c.vx) / 2;
          nb.vy = Math.min((a.vy + c.vy) / 2, 60) - 40;
          nb.touched = true;
          nb.cool = 0.10;
          nb.scale = 0.55;
          bodies.push(nb);
          var gain = FRUITS[nt].pts * combo;
          score += gain;
          burst(mx, my, nt, 10 + nt * 2, 200 + nt * 22);
          floater(mx, my - nb.r - 6,
            "+" + gain + (combo > 1 ? "  ×" + combo + "コンボ" : ""),
            combo > 1 ? "#ff8fa3" : "#ffffff", combo > 1 ? 22 : 18);
          if (nt > 5) shake = Math.max(shake, (nt - 5) * 1.4);
          sndMerge(nt, combo);

          if (nt === MAX_TIER) {
            melons++;
            confetti(mx, my);
            if (!newReached[nt]) showToast("スイカ完成！！ おめでとう！", 2400);
            else showToast("またスイカができた！", 1600);
            sndBig();
          }
          if (nt > maxTierReached) {
            maxTierReached = nt;
            if (!newReached[nt]) {
              newReached[nt] = true;
              if (nt !== MAX_TIER && nt >= 5) showToast(FRUITS[nt].name + " に進化！", 1500);
            }
          }
          if (nt === MAX_TIER) newReached[nt] = true;
        }
        updateHUD(); buildEvo();
        break;
      }
    }
    if (Object.keys(used).length) bodies = bodies.filter(function (b) { return !b.dead; });
  }

  /* ================= drop ================= */
  function drop() {
    if (state !== "playing" || cooldown > 0) return;
    var b = makeBody(current, dropX, DROP_Y);
    b.vy = 60;
    b.vx = (Math.random() - 0.5) * 26; // slight jitter so piles settle naturally
    bodies.push(b);
    drops++;
    current = next;
    next = randTier();
    cooldown = 0.55;
    sndDrop();
    drawNext(); updateHUD();
  }

  /* ================= game over check ================= */
  function checkDanger(dt) {
    var worst = 0;
    for (var i = 0; i < bodies.length; i++) {
      var b = bodies[i];
      if (!b.touched || b.age < 0.7) { b.above = 0; continue; }
      if (b.y - b.r < LINE_Y && Math.abs(b.vy) < 320) {
        b.above += dt;
      } else {
        b.above = Math.max(0, b.above - dt * 2.5);
      }
      if (b.above > worst) worst = b.above;
    }
    dangerLevel = Math.min(1, worst / OVER_TIME);
    if (worst >= OVER_TIME) gameOver();
  }

  function gameOver() {
    state = "over";
    if (score > best) best = score;
    document.getElementById("againBtn").textContent = "もう一度あそぶ";
    document.getElementById("scoreLabel").style.display = "";
    finalScore.style.fontSize = "";
    finalScore.textContent = score.toLocaleString();
    overlayTitle.textContent = melons > 0 ? "スイカ達成で終了！" : "ゲームオーバー";
    overlaySub.textContent =
      "最大フルーツ：" + (maxTierReached >= 0 ? FRUITS[maxTierReached].name : "―") +
      " ／ 合体 " + merges + " 回 ／ 最大 ×" + maxComboSeen + " コンボ";
    overlay.classList.add("show");
    sndOver();
    updateHUD();
  }

  /* ================= rendering ================= */
  function render() {
    ctx.clearRect(0, 0, LW, LH);
    ctx.save();
    if (shake > 0.2) {
      ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    }

    // playfield backdrop
    var bgGrad = ctx.createLinearGradient(0, 0, 0, LH);
    var dark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
    bgGrad.addColorStop(0, dark ? "#1d2f1a" : "#f7fbef");
    bgGrad.addColorStop(1, dark ? "#14220f" : "#e6f3d8");
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, LW, LH);

    // container box
    ctx.beginPath();
    ctx.moveTo(WALL_L - 10, 140);
    ctx.lineTo(WALL_L - 10, FLOOR + 12);
    ctx.quadraticCurveTo(WALL_L - 10, FLOOR + 22, WALL_L, FLOOR + 22);
    ctx.lineTo(WALL_R, FLOOR + 22);
    ctx.quadraticCurveTo(WALL_R + 10, FLOOR + 22, WALL_R + 10, FLOOR + 12);
    ctx.lineTo(WALL_R + 10, 140);
    ctx.lineWidth = 7;
    ctx.strokeStyle = dark ? "#5d8a4e" : "#7fae6d";
    ctx.stroke();
    ctx.fillStyle = dark ? "rgba(255,255,255,0.04)" : "rgba(255,255,255,0.35)";
    ctx.fill();

    // guide line from current fruit
    if (state === "playing" && cooldown <= 0) {
      ctx.save();
      ctx.setLineDash([4, 9]);
      ctx.strokeStyle = dark ? "rgba(255,255,255,0.30)" : "rgba(60,90,50,0.30)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(dropX, DROP_Y + FRUITS[current].r + 4);
      ctx.lineTo(dropX, FLOOR);
      ctx.stroke();
      ctx.restore();
    }

    // danger line
    var danger = dangerLevel > 0.02;
    var pulse = danger ? (0.65 + 0.35 * Math.sin(time * 14)) : 1;
    ctx.save();
    ctx.setLineDash([12, 8]);
    ctx.strokeStyle = danger
      ? "rgba(230,57,70," + (0.95 * pulse) + ")"
      : (dark ? "rgba(255,120,130,0.5)" : "rgba(230,57,70,0.45)");
    ctx.lineWidth = danger ? 3.5 : 2.5;
    ctx.beginPath();
    ctx.moveTo(WALL_L - 8, LINE_Y);
    ctx.lineTo(WALL_R + 8, LINE_Y);
    ctx.stroke();
    ctx.restore();
    if (danger) {
      ctx.save();
      ctx.font = "800 17px 'M PLUS Rounded 1c', sans-serif";
      ctx.textAlign = "center";
      ctx.fillStyle = "rgba(230,57,70," + pulse + ")";
      ctx.fillText("あふれそう…！", W / 2, LINE_Y - 12);
      // countdown bar
      ctx.fillStyle = "rgba(230,57,70,0.85)";
      var bw = (WALL_R - WALL_L) * dangerLevel;
      ctx.fillRect(WALL_L, LINE_Y + 6, bw, 5);
      ctx.restore();
    }

    // bodies
    for (var i = 0; i < bodies.length; i++) {
      var b = bodies[i];
      var sc = b.scale;
      drawFruit(ctx, b.tier, b.x, b.y, b.r * sc, { rot: b.rot, happy: b.above > 0.2 ? false : undefined });
    }

    // current fruit waiting to drop
    if (state === "playing" || state === "ready") {
      var cr = FRUITS[current].r;
      var bob = Math.sin(time * 2.4) * 3;
      var alpha = cooldown > 0 ? 0.35 : 1;
      ctx.save();
      ctx.globalAlpha = alpha;
      drawFruit(ctx, current, dropX, DROP_Y + bob, cr, {});
      ctx.restore();
      if (cooldown > 0) {
        ctx.save();
        ctx.font = "800 13px 'M PLUS Rounded 1c', sans-serif";
        ctx.textAlign = "center";
        ctx.fillStyle = dark ? "#cfe3c2" : "#5a6e52";
        ctx.fillText("つぎ…", dropX, DROP_Y - cr - 14);
        ctx.restore();
      }
    }

    // particles
    for (var p = 0; p < particles.length; p++) {
      var pt = particles[p];
      var k = Math.max(0, pt.life / pt.maxLife);
      ctx.save();
      ctx.globalAlpha = k;
      ctx.fillStyle = pt.color;
      if (pt.rect) {
        ctx.translate(pt.x, pt.y); ctx.rotate(pt.rot || 0);
        ctx.fillRect(-pt.size / 2, -pt.size / 4, pt.size, pt.size / 2);
      } else {
        ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.size * k + 0.6, 0, Math.PI * 2); ctx.fill();
      }
      ctx.restore();
    }

    // floaters
    ctx.save();
    ctx.textAlign = "center";
    for (var f = 0; f < floaters.length; f++) {
      var fl = floaters[f];
      ctx.globalAlpha = Math.min(1, fl.life * 1.6);
      ctx.font = "800 " + fl.size + "px 'M PLUS Rounded 1c', sans-serif";
      ctx.lineWidth = 4;
      ctx.strokeStyle = "rgba(30,45,25,0.55)";
      ctx.strokeText(fl.text, fl.x, fl.y);
      ctx.fillStyle = fl.color;
      ctx.fillText(fl.text, fl.x, fl.y);
    }
    ctx.restore();

    // combo indicator
    if (combo > 1 && comboTimer > 0 && state === "playing") {
      ctx.save();
      ctx.textAlign = "right";
      ctx.font = "800 24px 'M PLUS Rounded 1c', sans-serif";
      ctx.fillStyle = "#ff5d73";
      ctx.fillText("×" + combo + " コンボ!", WALL_R - 4, 52);
      ctx.fillStyle = "rgba(255,93,115,0.35)";
      ctx.fillRect(WALL_R - 104, 60, 100 * (comboTimer / 1.1), 5);
      ctx.restore();
    }

    ctx.restore();
  }

  /* ================= main loop ================= */
  var lastT = 0, acc = 0;
  function loop(ts) {
    requestAnimationFrame(loop);
    if (!lastT) lastT = ts;
    var dt = Math.min(0.05, (ts - lastT) / 1000);
    lastT = ts;
    time += dt;

    if (state === "playing") {
      // ease drop position toward target
      dropX += (targetX - dropX) * Math.min(1, dt * 22);
      var cr = FRUITS[current].r;
      dropX = Math.max(WALL_L + cr, Math.min(WALL_R - cr, dropX));

      if (cooldown > 0) cooldown -= dt;
      if (comboTimer > 0) { comboTimer -= dt; if (comboTimer <= 0) combo = 0; }

      acc += dt;
      var step = 1 / 60;
      var guard = 0;
      while (acc >= step && guard < 4) {
        physics(step);
        acc -= step; guard++;
        for (var i = 0; i < bodies.length; i++) {
          var b = bodies[i];
          b.age += step;
          if (b.cool > 0) b.cool -= step;
          if (b.scale < 1) b.scale = Math.min(1, b.scale + step * 5);
        }
        tryMerges();
        checkDanger(step);
        if (state !== "playing") { acc = 0; break; }
      }
      if (guard >= 4) acc = 0;
    }

    // particles & floaters always animate
    for (var p = particles.length - 1; p >= 0; p--) {
      var pt = particles[p];
      pt.life -= dt;
      if (pt.life <= 0) { particles.splice(p, 1); continue; }
      pt.vy += (pt.rect ? 620 : 300) * dt;
      pt.x += pt.vx * dt; pt.y += pt.vy * dt;
      if (pt.rot !== undefined) pt.rot += (pt.vr || 0) * dt;
    }
    for (var f = floaters.length - 1; f >= 0; f--) {
      floaters[f].life -= dt * 0.85;
      floaters[f].y -= dt * 44;
      if (floaters[f].life <= 0) floaters.splice(f, 1);
    }
    if (shake > 0) shake = Math.max(0, shake - dt * 26);

    render();
  }
  requestAnimationFrame(loop);

  /* ================= HUD / side panels ================= */
  function updateHUD() {
    scoreVal.textContent = score.toLocaleString();
    bestVal.textContent = Math.max(best, score).toLocaleString();
    maxFruitName.textContent = maxTierReached >= 0 ? FRUITS[maxTierReached].name : "―";
    document.getElementById("statDrops").textContent = drops;
    document.getElementById("statMerges").textContent = merges;
    var sc = document.getElementById("statCombo");
    sc.textContent = "×" + maxComboSeen;
    sc.className = maxComboSeen > 1 ? "combo-hot" : "";
    document.getElementById("statMelons").textContent = melons;
  }
  function drawNext() {
    nctx.clearRect(0, 0, NW, NH);
    var r = Math.min(FRUITS[next].r, 24);
    drawFruit(nctx, next, NW / 2, NH / 2 + 3, r, {});
  }
  var evoCanvases = [];
  function buildEvo() {
    var list = document.getElementById("evoList");
    if (!evoCanvases.length) {
      list.innerHTML = "";
      FRUITS.forEach(function (f, idx) {
        if (idx > 0) {
          var arrow = document.createElement("div");
          arrow.className = "evo-arrow";
          arrow.textContent = "▼ 合体";
          list.appendChild(arrow);
        }
        var row = document.createElement("div");
        row.className = "evo-item";
        row.id = "evo-" + idx;
        var c = document.createElement("canvas");
        var size = 30;
        c.width = size; c.height = size;
        c.style.width = size + "px"; c.style.height = size + "px";
        var g = c.getContext("2d");
        drawFruit(g, idx, size / 2, size / 2, size / 2 - 2, { noFace: true });
        var nm = document.createElement("span");
        nm.className = "evo-name"; nm.textContent = f.name;
        var pt = document.createElement("span");
        pt.className = "evo-pts";
        pt.textContent = idx === 0 ? "落とせる" : (idx <= DROP_MAX ? "落とせる ／ +" + f.pts : "+" + f.pts);
        row.appendChild(c); row.appendChild(nm); row.appendChild(pt);
        list.appendChild(row);
        evoCanvases.push(row);
      });
    }
    FRUITS.forEach(function (f, idx) {
      var row = evoCanvases[idx];
      var reached = idx <= maxTierReached || idx === 0;
      row.classList.toggle("reached", reached);
      row.classList.toggle("current-max", idx === maxTierReached && idx > 0);
    });
  }

  /* ================= input ================= */
  function canvasX(clientX) {
    var rect = canvas.getBoundingClientRect();
    return (clientX - rect.left) / rect.width * LW;
  }
  canvas.addEventListener("pointermove", function (e) {
    targetX = canvasX(e.clientX);
  });
  canvas.addEventListener("pointerdown", function (e) {
    e.preventDefault();
    ac();
    targetX = canvasX(e.clientX);
    dropX = Math.max(WALL_L + FRUITS[current].r, Math.min(WALL_R - FRUITS[current].r, targetX));
    if (state === "ready") reset();
    drop();
  });
  window.addEventListener("keydown", function (e) {
    if (e.key === "ArrowLeft") { targetX -= 26; e.preventDefault(); }
    else if (e.key === "ArrowRight") { targetX += 26; e.preventDefault(); }
    else if (e.key === " " || e.key === "ArrowDown") {
      e.preventDefault();
      ac();
      if (state === "ready") reset();
      dropX = Math.max(WALL_L + FRUITS[current].r, Math.min(WALL_R - FRUITS[current].r, targetX));
      drop();
    } else if (e.key && e.key.toLowerCase() === "p") {
      togglePause();
    }
  });

  function togglePause() {
    if (state === "playing") {
      state = "paused";
      pauseBtn.textContent = "再開する";
      document.getElementById("againBtn").textContent = "つづける";
      document.getElementById("scoreLabel").style.display = "";
      overlayTitle.textContent = "一時停止中";
      finalScore.textContent = score.toLocaleString();
      overlaySub.textContent = "つづけるには「再開する」を押してね";
      overlay.classList.add("show");
    } else if (state === "paused") {
      state = "playing";
      pauseBtn.textContent = "一時停止";
      overlay.classList.remove("show");
    }
  }
  pauseBtn.addEventListener("click", function () {
    if (state === "paused") { togglePause(); return; }
    if (state === "playing") togglePause();
  });
  document.getElementById("againBtn").addEventListener("click", function () {
    if (state === "paused") { togglePause(); return; }
    ac();
    this.textContent = "もう一度あそぶ";
    reset();
  });
  document.getElementById("restartBtn").addEventListener("click", function () { ac(); reset(); });
  soundBtn.addEventListener("click", function () {
    soundOn = !soundOn;
    soundBtn.textContent = soundOn ? "音 ON" : "音 OFF";
    if (soundOn) { ac(); tone(660, 0.1, "sine", 0.15); }
  });
  document.addEventListener("visibilitychange", function () {
    if (document.hidden && state === "playing") togglePause();
  });

  /* ================= start ================= */
  current = randTier(); next = randTier();
  state = "ready";
  drawNext(); updateHUD(); buildEvo();
  overlayTitle.textContent = "スイカゲーム";
  document.getElementById("scoreLabel").style.display = "none";
  finalScore.textContent = "めざせ スイカ！";
  finalScore.style.fontSize = "30px";
  overlaySub.textContent = "同じフルーツをくっつけて進化させよう。箱からあふれたら終了だよ。";
  overlay.classList.add("show");
  document.getElementById("againBtn").textContent = "ゲームスタート";
})();
</script>
</body>
</html>
